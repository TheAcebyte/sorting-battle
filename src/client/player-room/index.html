<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Sorting Battle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <h1 id="header">Sorting Battle</h1>
      <div id="container-display">
        <div id="container-team-1">
          <canvas class="canvas-game"></canvas>
          <p class="label-score">0 / 3</p>
        </div>
        <p id="label-vs">VS</p>
        <div id="container-team-2">
          <canvas class="canvas-game"></canvas>
          <p class="label-score">0 / 3</p>
        </div>
      </div>
      <div id="container-control">
        <button id="button-left-arrow" class="button-icon"></button>
        <button id="button-right-arrow" class="button-icon"></button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
